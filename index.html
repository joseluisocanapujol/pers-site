<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dr. Ocana-Pujol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfbf9;
    --ink: #17191b;
    --muted: #5b6167;
    --accent: #2f5d50;
    --accent-soft: #e7efec;
    --rule: #dddad3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --ink: #eceae4;
      --muted: #9aa0a6;
      --accent: #7fbba7;
      --accent-soft: #1c2724;
      --rule: #33363c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --ink: #eceae4;
    --muted: #9aa0a6;
    --accent: #7fbba7;
    --accent-soft: #1c2724;
    --rule: #33363c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 9vh 6vw 10vh;
  }

  main {
    max-width: 760px;
    width: 100%;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    flex-wrap: wrap;
    margin-bottom: 1.8rem;
  }

  .header-text {
    flex: 1 1 320px;
    min-width: 0;
  }

  .photo-placeholder {
    flex: 0 0 auto;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1px dashed var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 0.78rem;
    text-align: center;
    line-height: 1.3;
    overflow: hidden;
  }

  .photo-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.2rem, 5.5vw, 3rem);
    line-height: 1.1;
    margin: 0 0 0.8rem;
    letter-spacing: -0.01em;
  }

  /* Subtitle: both lines share one grid so the bars align */
  .subtitle {
    display: grid;
    grid-template-columns: max-content max-content 1fr;
    column-gap: 0.7em;
    row-gap: 0.5rem;
    font-size: 1.05rem;
    line-height: 1.4;
    color: var(--muted);
    margin: 0;
  }

  .subtitle .bar {
    color: var(--muted);
  }

  .linkedin-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    background: var(--accent-soft);
    color: var(--accent);
    text-decoration: none;
    font-size: 0.96rem;
    font-weight: 500;
    padding: 0.55rem 1rem;
    border-radius: 999px;
    margin: 0 0 2.6rem;
    transition: transform 0.15s ease;
  }

  .linkedin-pill:hover {
    transform: translateY(-1px);
  }

  .linkedin-pill .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  hr.divider {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 0 0 2.6rem;
  }

  .fields {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2.2rem;
  }

  @media (max-width: 640px) {
    .fields {
      grid-template-columns: 1fr;
      gap: 2.4rem;
    }
  }

  .field {
    border-top: 3px solid var(--accent);
    padding-top: 1.1rem;
  }

  .field h2 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 500;
    font-size: 1.2rem;
    margin: 0 0 0.9rem;
  }

  .field a.field-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--ink);
    text-decoration: none;
    font-size: 0.94rem;
    font-weight: 500;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.15rem;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .field a.field-link:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
</style>
</head>
<body>
  <main>
    <div class="header-row">
      <div class="header-text">
        <h1>Jose L. Ocana-Pujol</h1>
        <div class="subtitle">
          <span>IT Project Manager</span>
          <span class="bar" aria-hidden="true">|</span>
          <span>Dr. sc. ETH Zürich</span>

          <span>Multilingual Leader</span>
          <span class="bar" aria-hidden="true">|</span>
          <span>Clarifying Science &amp; Tech</span>
        </div>
      </div>
      <div class="photo-placeholder">
        <img src="photo.jpg">
      </div>
    </div>

    <a class="linkedin-pill" href="https://www.linkedin.com/in/joseluisopujol/" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
      Let's connect
    </a>

    <hr class="divider">

    <div class="fields">
      <div class="field">
        <h2>Academic Research</h2>
        <a class="field-link" href="https://scholar.google.com/citations?user=xYkwpOwAAAAJ&amp;hl=en&amp;oi=ao" target="_blank" rel="noopener">visit google scholar →</a>
      </div>

      <div class="field">
        <h2>Science Communication</h2>
        <a class="field-link" href="/scicomm/">explore →</a>
      </div>

      <div class="field">
        <h2>IT Project Management</h2>
        <a class="field-link" href="/professional/">explore →</a>
      </div>
    </div>
  </main>
</body>
</html>
